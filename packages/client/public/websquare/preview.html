<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSquare Preview</title>

    <!-- WebSquare 엔진 기본 CSS -->
    <link rel="stylesheet" href="/websquare/_websquare_/skin/stylesheet.css">
    <link rel="stylesheet" href="/websquare/_websquare_/skin/stylesheet_ext.css">

    <style>
        body {
            margin: 0;
            padding: 16px;
            background: #fff;
        }
        #loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100px;
            color: #666;
            font-family: sans-serif;
        }
    </style>

    <script type="text/javascript">
        // WebSquare External 설정
        window.WebSquareExternal = {
            baseServletURI: "/",
            baseURI: "/websquare/"
        };
    </script>

    <!-- WebSquare Config -->
    <script src="/websquare/config-global.js"></script>
</head>
<body>
    <div id="loading">WebSquare 엔진 로딩 중...</div>
    <div id="mf"></div>

    <script>
    // 미리보기 프레임 객체
    window.previewFrame = {
        ready: false
    };

    // WebSquare 엔진 초기화
    (function() {
        // 엔진 스크립트 로드
        const engineScript = document.createElement('script');
        engineScript.type = 'text/javascript';
        engineScript.src = '/websquare/_websquare_/wbd_B1548_babel_main.js';

        engineScript.onload = function() {
            if (typeof WebSquare !== 'undefined') {
                WebSquare.configPath = '/websquare/config-global.js';

                try {
                    const promiseObj = WebSquare.startApplication();
                    promiseObj.then(function() {
                        document.getElementById('loading').style.display = 'none';
                        previewFrame.ready = true;
                        if (window.parent !== window) {
                            window.parent.postMessage({ event: 'previewFrame.ready' }, '*');
                        }
                    }).catch(function() {
                        previewFrame.ready = true;
                        if (window.parent !== window) {
                            window.parent.postMessage({ event: 'previewFrame.ready' }, '*');
                        }
                    });
                } catch(e) {
                    previewFrame.ready = true;
                    if (window.parent !== window) {
                        window.parent.postMessage({ event: 'previewFrame.ready' }, '*');
                    }
                }
            }
        };

        engineScript.onerror = function() {
            document.getElementById('loading').textContent = '엔진 로드 실패';
        };

        document.head.appendChild(engineScript);
    })();

    // XML 렌더링
    previewFrame.render = async (xml) => {
        try {
            if (!WebSquare?.xmljs?.xml2json) {
                throw new Error('WebSquare engine not ready');
            }

            const xmlToJS = await WebSquare.xmljs.xml2json(xml);

            if (WebSquare.strictModeFrame?.removeFrame) {
                WebSquare.strictModeFrame.removeFrame();
            }

            // 잔재 DOM 정리 — 렌더마다 동일한 고정 id(panelContent1 등)를 쓰는 요소가
            // 이전 렌더 잔재와 겹치면 엔진이 id 중복 경고를 내므로 컨테이너를 비운다
            const mfEl = document.getElementById('mf');
            if (mfEl) mfEl.innerHTML = '';

            await WebSquare.jsLoader.start(xmlToJS, { spa: undefined });
            return true;
        } catch (e) {
            return e;
        }
    };

    // CSS 적용
    previewFrame.applyCss = (cssContents) => {
        document.querySelectorAll('style[data-custom-css]').forEach(el => el.remove());
        if (cssContents && cssContents.length > 0) {
            cssContents.forEach((content, index) => {
                const styleEl = document.createElement('style');
                styleEl.setAttribute('data-custom-css', 'custom-' + index);
                styleEl.textContent = content;
                document.head.appendChild(styleEl);
            });
        }
    };

    // postMessage 수신
    previewFrame.receiveMessage = async (event) => {
        if (event?.data?.event === 'previewFrame.sendXML') {
            const xml = event.data.xml;
            const css = event.data.css;
            const cssPaths = event.data.cssPaths;
            const initScript = event.data.initScript;
            const widgetStyle = event.data.widgetStyle;
            const response = {
                event: 'previewFrame.sendXMLResponse',
                success: false,
                error: undefined
            };

            try {
                const res = await previewFrame.render(xml);
                if (res === true) {
                    response.success = true;
                    // 렌더링 후 CSS 적용 + onpageload 수동 호출
                    setTimeout(() => {
                        if (css) previewFrame.applyCss(css);
                        // CSS 파일 경로 → <link> 태그로 로드 (url() 상대경로 해석 보장)
                        document.querySelectorAll('link[data-css-path]').forEach(el => el.remove());
                        if (cssPaths && cssPaths.length > 0) {
                            cssPaths.forEach(function(p, i) {
                                if (!p) return;
                                var link = document.createElement('link');
                                link.rel = 'stylesheet';
                                link.setAttribute('data-css-path', 'css-' + i);
                                // 절대 URL(http…)이면 그대로, 아니면 현재 origin 기준으로 해석
                                // (서버 에셋 URL은 그대로 두어야 url() 상대경로가 서버 기준으로 해석됨)
                                link.href = /^https?:\/\//.test(p) ? p : window.location.origin + '/' + p.replace(/^\//, '');
                                document.head.appendChild(link);
                            });
                        }
                        // 위젯 인라인 스타일 주입
                        if (widgetStyle) {
                            var existingWs = document.querySelector('style[data-widget-style]');
                            if (existingWs) existingWs.remove();
                            var wsEl = document.createElement('style');
                            wsEl.setAttribute('data-widget-style', 'true');
                            wsEl.textContent = widgetStyle;
                            document.head.appendChild(wsEl);
                        }
                        // 초기화 스크립트 실행 (widget addWidgets 등)
                        if (initScript) {
                            try {
                                console.log('[preview] initScript 실행');
                                new Function(initScript)();
                            } catch (e) {
                                console.warn('[preview] initScript error:', e);
                            }
                        }
                    }, 50);
                } else {
                    response.success = false;
                    response.error = res?.toString() || 'Unknown error';
                }
            } catch (e) {
                response.success = false;
                response.error = e?.toString() || 'Unknown error';
            }

            event.source.postMessage(response, event.origin);
        }
    };

    // 이벤트 리스너 등록
    window.addEventListener('message', previewFrame.receiveMessage);
    </script>
</body>
</html>
