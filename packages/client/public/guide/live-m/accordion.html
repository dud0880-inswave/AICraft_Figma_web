<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 뷰어가 다크 테마여도 라이트로 푼다(정본 CSS의 light-dark() 대응) -->
<meta name="color-scheme" content="light">
<title>accordion — 변환 결과</title>
<link rel="stylesheet" href="_ws/stylesheet.css">
<link rel="stylesheet" href="_ws/stylesheet_ext.css">
<link rel="stylesheet" href="_ws/fullcalendar.css">
<link rel="stylesheet" href="_ws/variable.css">
<link rel="stylesheet" href="_ws/base.css">
<link rel="stylesheet" href="_ws/base_mobile.css">
<style>
  :root{color-scheme:light !important}
  /* 가이드가 이 문서를 iframe으로 싣는다. 바깥 테두리는 가이드가 그리므로
     문서 자체는 여백 없이 조각만 담는다.
     단, 모바일은 base_mobile.css가 .sub_contents의 사방 20 패딩을 전제로 음수 마진
     full-bleed를 쓰므로 패딩을 죽이지 않는다(죽이면 카드가 415px로 삐져나가 잘린다). */
  html,body{margin:0;padding:0;background:#fff}
  .sub_contents{margin:0 !important;min-height:0 !important;background:#ffffff !important}
  /* base.css는 Pretendard를 굵기별 파일로 부르지만 번들에는 가변 폰트 한 벌만 둔다.
     같은 패밀리로 뒤에 선언해 1.8MB를 더 싣지 않고도 글꼴이 맞는다. */
  @font-face{
    font-family:'Pretendard'; font-weight:45 920; font-style:normal; font-display:swap;
    src:local('Pretendard Variable'), local('Pretendard'),
        url(../assets/fonts/PretendardVariable.woff2) format('woff2-variations');
  }
</style>
</head>
<body>
<!-- templatebox는 감싸지 않는다 — 디자인 템플릿 파일 자체의 섹션 래퍼라
     회색 면과 빈 여백만 만든다(가이드에서도 제외한 클래스다). -->
<div class="w2group sub_contents">
<div id="wq_uuid_603" class="w2group acdbox"><div id="wq_uuid_604" class="w2accordion acd"><div id="wq_uuid_604_col_0" class=""><div id="wq_uuid_604_panel_panels1" class="w2panels"><div id="wq_uuid_604_panel_panels1_title" class="w2panels_title" role="button" aria-expanded="true"><div id="wq_uuid_604_panel_panels1_title_image" class="w2panels_title_image w2panels_title_image_open"></div><span id="wq_uuid_604_panel_panels1_panelTitle_panelTitle1" class="w2panel_title_text" style="">Accordion 1</span></div><div id="_panel_panels1_panelContent_panelContent1" class="w2group w2panels_content_closed w2panels_content_open"><span id="wq_uuid_607" class="w2textbox ">내용</span></div></div><div id="wq_uuid_604_panel_panels2" class="w2panels"><div id="wq_uuid_604_panel_panels2_title" class="w2panels_title" role="button" aria-expanded="false"><div id="wq_uuid_604_panel_panels2_title_image" class="w2panels_title_image"></div><span id="wq_uuid_604_panel_panels2_panelTitle_panelTitle2" class="w2panel_title_text" style="">Accordion 2</span></div><div id="_panel_panels2_panelContent_panelContent2" class="w2group w2panels_content_closed"><span id="wq_uuid_610" class="w2textbox ">내용</span></div></div><div id="wq_uuid_604_panel_panels3" class="w2panels"><div id="wq_uuid_604_panel_panels3_title" class="w2panels_title" role="button" aria-expanded="false"><div id="wq_uuid_604_panel_panels3_title_image" class="w2panels_title_image"></div><span id="wq_uuid_604_panel_panels3_panelTitle_panelTitle3" class="w2panel_title_text" style="">Accordion 3</span></div><div id="_panel_panels3_panelContent_panelContent3" class="w2group w2panels_content_closed"><span id="wq_uuid_613" class="w2textbox ">내용</span></div></div></div></div></div>
</div>
</body>
</html>
